name: Build Vaultwarden & Fetch Web Vault (Debian 11)

on:
  #schedule:
  #  - cron: "0 3 * * *" # Kiểm tra bản mới mỗi ngày lúc 03:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Version Vaultwarden muốn build (để trống để tự lấy bản mới nhất, vd: 1.37.5)"
        required: false
        type: string
      force:
        description: "Ghi đè nếu release đã tồn tại"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      git_tag: ${{ steps.ver.outputs.git_tag }}
      should_run: ${{ steps.ver.outputs.should_run }}
    steps:
      - name: Determine target Vaultwarden version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE_RUN: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VW_VER="${INPUT_VERSION#v}"
          else
            LATEST_TAG=$(curl -fsSL https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r '.tag_name // empty')
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(curl -fsSL https://api.github.com/repos/dani-garcia/vaultwarden/tags | jq -r '.[0].name')
            fi
            VW_VER="${LATEST_TAG#v}"
          fi

          if [ -z "$VW_VER" ]; then
            echo "Không xác định được version Vaultwarden." >&2
            exit 1
          fi

          # Xác định chính xác tên tag trên repo gốc (có 'v' hoặc không có 'v')
          if git ls-remote --tags --exit-code https://github.com/dani-garcia/vaultwarden.git "refs/tags/${VW_VER}" >/dev/null 2>&1; then
            GIT_TAG="${VW_VER}"
          elif git ls-remote --tags --exit-code https://github.com/dani-garcia/vaultwarden.git "refs/tags/v${VW_VER}" >/dev/null 2>&1; then
            GIT_TAG="v${VW_VER}"
          else
            echo "Không tìm thấy tag ${VW_VER} hoặc v${VW_VER} trên dani-garcia/vaultwarden." >&2
            exit 1
          fi

          # Kiểm tra xem release đã tồn tại ở repo hiện tại chưa
          EXISTS="false"
          if gh release view "$VW_VER" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
             gh release view "v${VW_VER}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS="true"
          fi

          SHOULD_RUN="true"
          if [ "$EXISTS" = "true" ] && [ "$FORCE_RUN" != "true" ]; then
            SHOULD_RUN="false"
          fi

          echo "version=$VW_VER" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Target Vaultwarden: $VW_VER (tag: $GIT_TAG) | Should run: $SHOULD_RUN"

  build-vaultwarden-deb11:
    needs: resolve-version
    if: ${{ needs.resolve-version.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: debian:11-slim
    steps:
      - name: Install build dependencies (Debian 11)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev libsqlite3-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout Vaultwarden source
        shell: bash
        env:
          GIT_TAG: ${{ needs.resolve-version.outputs.git_tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GIT_TAG" https://github.com/dani-garcia/vaultwarden.git /tmp/vw-src

      - name: Build Vaultwarden (SQLite)
        shell: bash
        env:
          VW_VER: ${{ needs.resolve-version.outputs.version }}
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cd /tmp/vw-src
          cargo build --features sqlite --release
          strip /tmp/vw-src/target/release/vaultwarden

          mkdir -p /tmp/artifacts
          tar -czf "/tmp/artifacts/vaultwarden-debian11-${VW_VER}-amd64.tar.gz" \
            -C /tmp/vw-src/target/release vaultwarden

      - name: Upload Vaultwarden artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-deb11
          path: /tmp/artifacts/vaultwarden-debian11-*.tar.gz
          if-no-files-found: error

  fetch-web-vault:
    needs: resolve-version
    if: ${{ needs.resolve-version.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download latest prebuilt Web Vault
        shell: bash
        env:
          VW_VER: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts

          # Lấy URL tải file .tar.gz từ release mới nhất của vaultwarden/vw_web_builds
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/vaultwarden/vw_web_builds/releases/latest)
          WV_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' | head -n1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Không tìm thấy file .tar.gz trong release mới nhất của vw_web_builds." >&2
            exit 1
          fi

          echo "Downloading Web Vault ${WV_TAG} from ${ASSET_URL}..."
          curl -fL "$ASSET_URL" -o "/tmp/artifacts/web-vault-${WV_TAG}-for-vw-${VW_VER}.tar.gz"

      - name: Upload Web Vault artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-vault-dist
          path: /tmp/artifacts/web-vault-*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [resolve-version, build-vaultwarden-deb11, fetch-web-vault]
    if: ${{ needs.resolve-version.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          VW_VER: ${{ needs.resolve-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WV_FILE=$(ls /tmp/release-assets/web-vault-*.tar.gz | xargs -n1 basename)
          if gh release view "$VW_VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VW_VER" /tmp/release-assets/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$VW_VER" /tmp/release-assets/* \
              --repo "${{ github.repository }}" \
              --title "Vaultwarden ${VW_VER} (Debian 11)" \
              --notes "Automated build for **Debian 11 (Bullseye)** (SQLite) bundled with latest prebuilt **Web Vault** (\`${WV_FILE}\`)."
          fi