name: Build Vaultwarden & Web Vault (Debian 11)

on:
  schedule:
    - cron: "0 3 * * *" # Kiểm tra bản mới mỗi ngày lúc 03:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Version Vaultwarden muốn build (để trống để tự lấy bản mới nhất, vd: 1.37.5)"
        required: false
        type: string
      force:
        description: "Ghi đè nếu release đã tồn tại"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      git_tag: ${{ steps.ver.outputs.git_tag }}
      wv_tag: ${{ steps.ver.outputs.wv_tag }}
      should_run: ${{ steps.ver.outputs.should_run }}
    steps:
      - name: Determine target Vaultwarden & Web Vault versions
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE_RUN: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VW_VER="${INPUT_VERSION#v}"
          else
            LATEST_TAG=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest | jq -r '.tag_name // empty')
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG=$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                https://api.github.com/repos/dani-garcia/vaultwarden/tags | jq -r '.[0].name')
            fi
            VW_VER="${LATEST_TAG#v}"
          fi

          if [ -z "$VW_VER" ]; then
            echo "Không xác định được version Vaultwarden." >&2
            exit 1
          fi

          if git ls-remote --tags --exit-code https://github.com/dani-garcia/vaultwarden.git "refs/tags/${VW_VER}" >/dev/null 2>&1; then
            GIT_TAG="${VW_VER}"
          elif git ls-remote --tags --exit-code https://github.com/dani-garcia/vaultwarden.git "refs/tags/v${VW_VER}" >/dev/null 2>&1; then
            GIT_TAG="v${VW_VER}"
          else
            echo "Không tìm thấy tag ${VW_VER} hoặc v${VW_VER} trên dani-garcia/vaultwarden." >&2
            exit 1
          fi

          # Thử lấy tag mới nhất của vw_web_builds để checkout đúng bản web vault
          WV_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/vaultwarden/vw_web_builds/releases/latest | jq -r '.tag_name // empty' || true)
          if [ -z "$WV_TAG" ] || [ "$WV_TAG" = "null" ]; then
            WV_TAG=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/vaultwarden/vw_web_builds/tags | jq -r '.[0].name // empty' || true)
          fi

          EXISTS="false"
          if gh release view "$VW_VER" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
             gh release view "v${VW_VER}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS="true"
          fi

          SHOULD_RUN="true"
          if [ "$EXISTS" = "true" ] && [ "$FORCE_RUN" != "true" ]; then
            SHOULD_RUN="false"
          fi

          echo "version=$VW_VER" >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG" >> "$GITHUB_OUTPUT"
          echo "wv_tag=$WV_TAG" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Target VW: $VW_VER ($GIT_TAG) | WV tag: ${WV_TAG:-HEAD} | Should run: $SHOULD_RUN"

  build-vaultwarden-deb11:
    needs: resolve-version
    if: ${{ needs.resolve-version.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: debian:11-slim
    steps:
      - name: Install build dependencies (Debian 11)
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g; s|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list
          find /etc/apt/sources.list.d/ -type f -name '*.list' -exec sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g; s|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' {} + 2>/dev/null || true

          apt-get -o Acquire::Check-Valid-Until=false update
          DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config perl zlib1g-dev libsqlite3-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout Vaultwarden source
        shell: bash
        env:
          GIT_TAG: ${{ needs.resolve-version.outputs.git_tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GIT_TAG" https://github.com/dani-garcia/vaultwarden.git /tmp/vw-src

      - name: Build OpenSSL 3 for Debian 11
        shell: bash
        run: |
          set -euo pipefail
          OPENSSL_VER="3.0.15"
          curl -fsSL "https://www.openssl.org/source/openssl-${OPENSSL_VER}.tar.gz" -o /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd "/tmp/openssl-${OPENSSL_VER}"

          ./Configure linux-x86_64 \
            --prefix=/opt/openssl3 \
            --openssldir=/opt/openssl3/ssl \
            no-shared no-zlib

          make -j"$(nproc)"
          make install_sw

          rm -rf /tmp/openssl.tar.gz "/tmp/openssl-${OPENSSL_VER}"

          {
            echo "OPENSSL_DIR=/opt/openssl3"
            echo "OPENSSL_LIB_DIR=/opt/openssl3/lib64"
            echo "OPENSSL_INCLUDE_DIR=/opt/openssl3/include"
            echo "OPENSSL_STATIC=1"
            echo "PKG_CONFIG_PATH=/opt/openssl3/lib64/pkgconfig:/opt/openssl3/lib/pkgconfig"
          } >> "$GITHUB_ENV"
      
      - name: Build Vaultwarden (SQLite)
        shell: bash
        env:
          VW_VER: ${{ needs.resolve-version.outputs.version }}
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          cd /tmp/vw-src
          cargo build --features sqlite --release
          strip /tmp/vw-src/target/release/vaultwarden

          mkdir -p /tmp/artifacts
          tar -czf "/tmp/artifacts/vaultwarden-debian11-${VW_VER}-amd64.tar.gz" \
            -C /tmp/vw-src/target/release vaultwarden

      - name: Upload Vaultwarden artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultwarden-deb11
          path: /tmp/artifacts/vaultwarden-debian11-*.tar.gz
          if-no-files-found: error

  build-web-vault:
    needs: resolve-version
    if: ${{ needs.resolve-version.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Web Vault from source
        shell: bash
        env:
          VW_VER: ${{ needs.resolve-version.outputs.version }}
          WV_TAG: ${{ needs.resolve-version.outputs.wv_tag }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail

          if [ -n "$WV_TAG" ]; then
            git clone --depth 1 --branch "$WV_TAG" https://github.com/vaultwarden/vw_web_builds.git /tmp/vw-web || \
              git clone --depth 1 https://github.com/vaultwarden/vw_web_builds.git /tmp/vw-web
          else
            git clone --depth 1 https://github.com/vaultwarden/vw_web_builds.git /tmp/vw-web
          fi

          cd /tmp/vw-web
          echo "Cấu trúc repo vw_web_builds:"
          ls -la

          install_deps_and_build() {
            local dir="$1"
            cd "$dir"
            if [ -f package-lock.json ]; then
              npm ci
            elif [ -f package.json ]; then
              npm install --no-audit --no-fund
            fi
          }

          if [ -f package.json ]; then
            install_deps_and_build "/tmp/vw-web"
            # Thử chạy các script build phổ biến nếu có
            for script_name in "dist:oss:selfhost" "build:oss:selfhost" "build"; do
              if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script_name'] ? 0 : 1)" 2>/dev/null; then
                npm run "$script_name"
                break
              fi
            done
          fi

          if [ -d /tmp/vw-web/apps/web ]; then
            install_deps_and_build "/tmp/vw-web/apps/web"
            for script_name in "dist:oss:selfhost" "build:oss:selfhost" "build"; do
              if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$script_name'] ? 0 : 1)" 2>/dev/null; then
                npm run "$script_name"
                break
              fi
            done
          fi

          # Tìm thư mục build đầu ra (ưu tiên web-vault, build, dist)
          DIST_DIR=""
          for candidate in \
            "/tmp/vw-web/web-vault" \
            "/tmp/vw-web/apps/web/build" \
            "/tmp/vw-web/build" \
            "/tmp/vw-web/dist"
          do
            if [ -d "$candidate" ] && [ -n "$(ls -A "$candidate" 2>/dev/null)" ]; then
              DIST_DIR="$candidate"
              break
            fi
          done

          if [ -z "$DIST_DIR" ]; then
            echo "Không tìm thấy thư mục build đầu ra sau khi build." >&2
            find /tmp/vw-web -maxdepth 3 -not -path '*/node_modules*' >&2
            exit 1
          fi

          echo "Đóng gói output từ: $DIST_DIR"
          mkdir -p /tmp/wv-pkg/web-vault /tmp/artifacts
          cp -r "${DIST_DIR}/." /tmp/wv-pkg/web-vault/

          ARCHIVE_NAME="web-vault-${WV_TAG:-latest}-for-vw-${VW_VER}.tar.gz"
          tar -czf "/tmp/artifacts/${ARCHIVE_NAME}" -C /tmp/wv-pkg web-vault

      - name: Upload Web Vault artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-vault-dist
          path: /tmp/artifacts/web-vault-*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [resolve-version, build-vaultwarden-deb11, build-web-vault]
    if: ${{ needs.resolve-version.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          VW_VER: ${{ needs.resolve-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WV_FILE=$(ls /tmp/release-assets/web-vault-*.tar.gz | xargs -n1 basename)
          if gh release view "$VW_VER" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VW_VER" /tmp/release-assets/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$VW_VER" /tmp/release-assets/* \
              --repo "${{ github.repository }}" \
              --title "Vaultwarden ${VW_VER} (Debian 11)" \
              --notes "Automated build for **Debian 11 (Bullseye)** (SQLite) and built **Web Vault** (\`${WV_FILE}\`)."
          fi